# litestream.yml
dbs:
  - path: /app/data/storage.sqlite
    replicas:
      - type: s3
        # These variables will be injected from the Render environment dashboard
        bucket: ${LITESTREAM_BUCKET}
        endpoint: ${LITESTREAM_ENDPOINT}
        path: storage.sqlite
        # Region is required by Litestream even if using a region-less provider
        region: us-east-1
        # PERFORMANCE FIX: Tell Litestream to sync every 10 seconds instead of 1 second.
        # This massively drops the CPU usage, letting the web dashboard load much faster.
        sync-interval: 10s
